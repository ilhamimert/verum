[package]
name = "verum_core"
version = "0.1.0"
edition = "2021"
authors = ["VERUM Protocol"]
description = "VERUM (VRM) - World's first AI-consensus blockchain"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
ripemd = "0.1"
base58 = "0.2"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"

[lib]
name = "verum_core"
path = "src/lib.rs"

[[bin]]
name = "verum"
path = "src/main.rs"

[[bin]]
name = "verum-web"
path = "src/bin/web.rs"
