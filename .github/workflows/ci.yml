name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  token-tests:
    name: "verum-token: Hardhat tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verum-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verum-token/package-lock.json
      - run: npm ci
      - run: npx hardhat test

  core-tests:
    name: "verum-core: cargo test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verum-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verum-core
      - run: cargo test
      - run: cargo build --bins
